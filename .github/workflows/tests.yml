name: tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PySide6
      QT_API: pyside6
      MPLCONFIGDIR: .test-tmp/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Verify Qt and bundled native SDK
        run: uv run --frozen --python ${{ matrix.python-version }} python setup_env.py
      - name: Run tests
        run: uv run --frozen --python ${{ matrix.python-version }} python -m unittest discover -s tests -v
